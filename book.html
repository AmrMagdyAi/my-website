<script>
/* For places that can't preview a Calendly link, like LinkedIn Featured: link crawlers read this page's tags, and people go straight on to the calendar.

(function(){
var q=new URLSearchParams(location.search),r=document.referrer,t={};
['utm_source','utm_medium','utm_campaign','utm_content'].forEach(function(k){var v=q.get(k);if(v)t[k]=v;});

if(!t.utm_medium)t.utm_medium='book_page';
var url='https://calendly.com/amr-magdy-crm/30min?'+Object.keys(t).map(function(k){return k+'='+encodeURIComponent(t[k]);}).join('&');
document.getElementById('go').href=url;
var gone=false;function go(){if(!gone){gone=true;location.replace(url);}}
gtag('event','generate_lead',{method:'booking',position:'book_page',page_path:location.pathname,event_callback:go,event_timeout:700});
setTimeout(go,800);
})();
</script>
