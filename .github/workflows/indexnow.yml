name: IndexNow ping
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_pages:
        description: Send every page in sitemap.xml
        type: boolean
        default: true
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Send changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          KEY=fdca12d7fd1a66d185ecf80d47bbf09a
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES=$(grep -o 'https://amrmagdy.com/[^<]*' sitemap.xml | sed 's#https://amrmagdy.com/##; s#^$#index.html#')
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.html')
          else
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.html')
          fi
          URLS=""
          for f in $FILES; do
            case "$f" in
              index.html) u="https://amrmagdy.com/";;
              */*) continue;;
              *) u="https://amrmagdy.com/$f";;
            esac
            URLS="$URLS\"$u\","
          done
          if [ -z "$URLS" ]; then echo "No changed pages"; exit 0; fi
          BODY="{\"host\":\"amrmagdy.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://amrmagdy.com/$KEY.txt\",\"urlList\":[${URLS%,}]}"
          echo "$BODY"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
